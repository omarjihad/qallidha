<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3b1d20" />
    <title>قلّدها</title>
    <link rel="icon" href="/img/icon.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/baloo-bhaijaan-2-arabic-800-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="modulepreload" href="/vendor/three.min.js" />
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="vignette"></div>
      <div id="labels"></div>

      <div id="hud">
        <button id="exitBtn" class="icon-btn" aria-label="خروج">✕</button>
        <div id="hudInfo"></div>
        <div id="cards"></div>
      </div>

      <div id="dim"></div>
      <div id="meme"></div>
      <div id="wheel"></div>
      <div id="center"></div>

      <div id="bottom">
        <div id="caption"></div>
        <div id="goText">يلا!</div>
        <div id="wavebar"><canvas></canvas><div id="countBadge"></div></div>
      </div>

      <div id="lobbyBar"></div>
      <div id="reacts"></div>
      <div id="overlay"></div>
      <div id="netState"></div>
      <div id="toast"></div>

      <div id="boot">
        <div class="boot-logo">قلّدها!</div>
        <div class="boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
